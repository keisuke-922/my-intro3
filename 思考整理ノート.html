<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>思考整理ノート</title>
<style>
  :root {
    --bg: #f7f5ff;
    --surface: #ffffff;
    --surface2: #f0eeff;
    --primary: #7c6fcd;
    --primary-light: #a99de8;
    --primary-dark: #5a4faa;
    --text: #2d2d3a;
    --text-sub: #6b6b80;
    --border: #e0daf7;
    --shadow: 0 4px 20px rgba(124,111,205,0.1);
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Meiryo', sans-serif;
    min-height: 100vh;
    padding: 24px 16px 60px;
  }

  header {
    text-align: center;
    margin-bottom: 32px;
  }

  .logo {
    font-size: 28px;
    font-weight: 700;
    color: var(--primary-dark);
    letter-spacing: -0.5px;
  }

  .logo span { color: var(--primary); }

  .subtitle {
    margin-top: 6px;
    font-size: 14px;
    color: var(--text-sub);
  }

  .container {
    max-width: 700px;
    margin: 0 auto;
  }

  /* INPUT CARD */
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 20px;
    border: 1px solid var(--border);
  }

  .card-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--primary-dark);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .hint {
    font-size: 12px;
    color: var(--text-sub);
    background: var(--surface2);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 14px;
    line-height: 1.6;
  }

  .hint code {
    background: var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 12px;
    font-family: inherit;
  }

  textarea {
    width: 100%;
    min-height: 180px;
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 15px;
    font-family: inherit;
    color: var(--text);
    background: #fdfcff;
    resize: vertical;
    outline: none;
    line-height: 1.7;
    transition: border-color 0.2s;
  }

  textarea:focus { border-color: var(--primary-light); }
  textarea::placeholder { color: #bbb8cc; }

  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 12px 24px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    font-size: 15px;
    font-family: inherit;
    font-weight: 700;
    transition: transform 0.1s, box-shadow 0.1s, background 0.2s;
  }

  .btn:active { transform: scale(0.97); }

  .btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    box-shadow: 0 4px 14px rgba(124,111,205,0.35);
  }

  .btn-primary:hover { box-shadow: 0 6px 20px rgba(124,111,205,0.45); }

  .btn-secondary {
    background: var(--surface2);
    color: var(--text-sub);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover { background: var(--border); }

  /* RESULTS */
  #results { display: none; }

  .results-header {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-sub);
    margin-bottom: 14px;
    text-align: center;
    letter-spacing: 0.5px;
  }

  /* CATEGORY CARD */
  .cat-card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 16px;
    overflow: hidden;
    border: 1px solid var(--border);
    animation: slideIn 0.3s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .cat-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 18px;
    font-weight: 700;
    font-size: 14px;
    border-bottom: 1px solid var(--border);
  }

  .cat-icon {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }

  .cat-body { padding: 16px 18px; }

  /* Items list */
  .raw-items {
    margin-bottom: 14px;
  }

  .raw-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 5px 0;
    font-size: 13px;
    color: var(--text-sub);
    border-bottom: 1px dashed var(--border);
  }

  .raw-item:last-child { border-bottom: none; }

  .raw-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    margin-top: 7px;
    flex-shrink: 0;
  }

  /* Organized text */
  .organized-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-sub);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .organized-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .organized-text {
    background: var(--surface2);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 14px;
    line-height: 1.8;
    color: var(--text);
    white-space: pre-wrap;
    border-left: 3px solid var(--primary-light);
  }

  .copy-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 8px;
    font-size: 12px;
    color: var(--primary);
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 12px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s;
  }

  .copy-btn:hover { background: var(--surface2); }

  /* SUMMARY CARD */
  .summary-card {
    background: linear-gradient(135deg, #7c6fcd11, #a99de822);
    border: 2px solid var(--primary-light);
    border-radius: var(--radius);
    padding: 20px 22px;
    margin-bottom: 20px;
    animation: slideIn 0.3s ease 0.1s both;
  }

  .summary-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--primary-dark);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .summary-text {
    font-size: 14px;
    line-height: 1.9;
    color: var(--text);
    white-space: pre-wrap;
  }

  /* LOADING */
  .loading {
    text-align: center;
    padding: 32px;
    color: var(--text-sub);
    font-size: 14px;
    display: none;
  }

  .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 12px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* EXAMPLE BUTTON */
  .example-link {
    font-size: 12px;
    color: var(--primary);
    cursor: pointer;
    text-decoration: underline;
    background: none;
    border: none;
    font-family: inherit;
    padding: 0;
  }

  .char-count {
    font-size: 12px;
    color: var(--text-sub);
    text-align: right;
    margin-top: 6px;
  }

  /* UNCLASSIFIED */
  .other-card .cat-header {
    background: #fafafa;
  }

  @media (max-width: 500px) {
    .btn { font-size: 14px; padding: 11px 18px; }
    .card { padding: 18px 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="logo">思考整理<span>ノート</span></div>
    <div class="subtitle">頭の中をそのまま打ち込むだけで、話しやすく整理してくれます</div>
  </header>

  <!-- INPUT -->
  <div class="card">
    <div class="card-title">
      ✏️ 出来事・気持ちを入力
    </div>
    <div class="hint">
      思いついたことを<strong>1行1つ</strong>で書いてください。箇条書き（<code>・</code> や <code>-</code>）でも、普通の文でも大丈夫です。<br>
      <button class="example-link" onclick="insertExample()">📋 入力例を見る</button>
    </div>
    <textarea id="inputArea" placeholder="例：
・今日の会議で発言できなかった
・上司に報告するのが怖い
・友達と話すと少し楽になる
・最近なんか疲れてる気がする"></textarea>
    <div class="char-count"><span id="charCount">0</span> 文字</div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="organize()">✨ 整理する</button>
      <button class="btn btn-secondary" onclick="clearAll()">🗑 クリア</button>
    </div>
  </div>

  <!-- LOADING -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    整理中です...
  </div>

  <!-- RESULTS -->
  <div id="results">
    <div class="results-header">── 整理結果 ──</div>

    <!-- Overall summary -->
    <div class="summary-card" id="summaryCard">
      <div class="summary-title">💬 会話で使えるまとめ</div>
      <div class="summary-text" id="summaryText"></div>
      <button class="copy-btn" onclick="copyText('summaryText')">📋 コピー</button>
    </div>

    <!-- Category cards -->
    <div id="categoryCards"></div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────
//  CATEGORY DEFINITIONS
// ─────────────────────────────────────────────────
const CATEGORIES = [
  {
    id: 'work',
    name: '仕事・学校',
    icon: '📚',
    colorBg: '#ede9ff',
    colorDot: '#7c6fcd',
    keywords: [
      '仕事','会社','職場','学校','授業','課題','上司','同僚','先生','勉強',
      'バイト','アルバイト','面接','プレゼン','会議','提出','締め切り','テスト',
      '試験','レポート','ゼミ','部活','委員会','職員','社員','業務','タスク',
      '研修','残業','出社','リモート','オフィス','クライアント','打ち合わせ',
      '授業中','講義','単位','卒論','就活','インターン'
    ]
  },
  {
    id: 'relationship',
    name: '人間関係',
    icon: '👥',
    colorBg: '#e6faf4',
    colorDot: '#00b894',
    keywords: [
      '友達','友人','家族','お母さん','お父さん','母','父','兄','姉','弟','妹',
      '彼氏','彼女','パートナー','恋人','先輩','後輩','同期','グループ','チーム',
      '仲間','クラス','クラスメート','隣の','あの人','あいつ','同僚','上司','部下',
      '親友','知り合い','付き合い'
    ]
  },
  {
    id: 'emotion',
    name: '気持ち・感情',
    icon: '💭',
    colorBg: '#fff3f0',
    colorDot: '#e17055',
    keywords: [
      '嬉しい','悲しい','辛い','楽しい','怖い','不安','心配','ストレス','イライラ',
      '疲れ','気持ち','感じ','焦り','安心','幸せ','落ち込','むかつ','びっくり',
      '驚き','緊張','恥ずかしい','恥ずかし','照れ','寂し','孤独','むなし','虚し',
      '後悔','自己嫌悪','もやもや','モヤモヤ','なんか','なんとなく','複雑',
      'ほっと','うれし','かなし','つら','かわいそう'
    ]
  },
  {
    id: 'health',
    name: '体調・健康',
    icon: '🌱',
    colorBg: '#f0fff8',
    colorDot: '#00cec9',
    keywords: [
      '体調','病気','頭痛','腹痛','眠れない','疲労','病院','薬','食欲','睡眠',
      '熱','風邪','だるい','痛い','眠い','体が','体調不良','めまい','吐き気',
      '食べられ','食べれ','お腹','胃','肩こり','腰痛','生理','休息','休んだ',
      '寝れ','寝られ','不眠','過労','ぐったり'
    ]
  },
  {
    id: 'trouble',
    name: '困りごと・悩み',
    icon: '🤔',
    colorBg: '#fffbf0',
    colorDot: '#e6a817',
    keywords: [
      '困った','困っている','悩み','悩んで','問題','トラブル','失敗','ミス',
      '怒られ','うまくいかない','難しい','迷っている','迷って','どうすれば',
      'どうしよう','どうすれ','わからない','分からない','できない','苦手',
      '避けて','逃げ','うまく言え','うまく伝え','言えない','伝わらない',
      'しんどい','きつい','つまずい','行き詰'
    ]
  },
  {
    id: 'hobby',
    name: '趣味・出来事',
    icon: '⭐',
    colorBg: '#f0f6ff',
    colorDot: '#4a9edd',
    keywords: [
      '映画','音楽','ゲーム','読書','スポーツ','料理','旅行','買い物',
      '食べた','食べに','行った','見た','聞いた','やった','遊んだ','楽しんだ',
      'カフェ','散歩','運動','推し','アニメ','漫画','ドラマ','コンサート',
      'ライブ','イベント','SNS','YouTube','Netflix'
    ]
  }
];

// ─────────────────────────────────────────────────
//  CLASSIFICATION
// ─────────────────────────────────────────────────
function classifyItem(text) {
  const scores = {};
  CATEGORIES.forEach(cat => {
    scores[cat.id] = cat.keywords.reduce((acc, kw) => acc + (text.includes(kw) ? 1 : 0), 0);
  });
  let best = null, bestScore = 0;
  Object.entries(scores).forEach(([id, score]) => {
    if (score > bestScore) { bestScore = score; best = id; }
  });
  return best || 'other';
}

// ─────────────────────────────────────────────────
//  ITEM TYPE DETECTION
// ─────────────────────────────────────────────────
const EVENT_WORDS   = ['した','だった','あった','行った','言われた','怒られた','できた','もらった','送った','来た','会った'];
const EMOTION_WORDS = ['嬉しい','悲しい','辛い','不安','心配','ストレス','イライラ','疲れ','落ち込','もやもや','モヤモヤ','焦り','緊張','寂し','虚し','恥ずかし','しんどい'];
const CAUSE_WORDS   = ['から','ので','ため','せいで','おかげで','だから','なので'];
const WISH_WORDS    = ['したい','してほしい','なりたい','できれば','できたら','うまく','うまくなり','解決','改善','伝えたい'];

function detectType(text) {
  if (WISH_WORDS.some(w => text.includes(w))) return 'wish';
  if (EMOTION_WORDS.some(w => text.includes(w))) return 'emotion';
  if (CAUSE_WORDS.some(w => text.includes(w))) return 'cause';
  if (EVENT_WORDS.some(w => text.includes(w))) return 'event';
  return 'fact';
}

// ─────────────────────────────────────────────────
//  ORGANIZE: add connective phrases
// ─────────────────────────────────────────────────
const TRANSITIONS = {
  'fact→fact':     'また、',
  'fact→event':    '',
  'fact→emotion':  'そのせいか、',
  'fact→cause':    'というのも、',
  'fact→wish':     'だから、',
  'event→fact':    'それから、',
  'event→event':   'さらに、',
  'event→emotion': 'そのせいで、',
  'event→cause':   'というのも、',
  'event→wish':    'だから、',
  'emotion→fact':  'でも、',
  'emotion→event': 'そんな中、',
  'emotion→emotion':'それに、',
  'emotion→cause': 'なぜかというと、',
  'emotion→wish':  'だから、',
  'cause→fact':    'だから、',
  'cause→event':   'そのため、',
  'cause→emotion': 'そのせいで、',
  'cause→wish':    'それで、',
  'wish→fact':     'ちなみに、',
  'wish→event':    'ちなみに、',
  'wish→wish':     'また、',
};

function getTransition(fromType, toType) {
  return TRANSITIONS[`${fromType}→${toType}`] || 'それから、';
}

function organizeItems(items) {
  if (items.length === 0) return '';

  // Type each item and sort: fact/event → cause → emotion → wish
  const ORDER = { fact: 0, event: 0, cause: 1, emotion: 2, wish: 3 };
  const typed = items.map(text => ({ text: cleanBullet(text), type: detectType(text) }));
  typed.sort((a, b) => ORDER[a.type] - ORDER[b.type]);

  const parts = typed.map((item, i) => {
    if (i === 0) {
      // First item: gentle opener
      if (item.type === 'emotion') return '実は、' + item.text;
      if (item.type === 'trouble') return 'ちょっと困っているんですが、' + item.text;
      return item.text;
    }
    const prev = typed[i - 1];
    const trans = getTransition(prev.type, item.type);
    return trans + item.text;
  });

  // 文末を自然に補う
  return parts.map(p => {
    const last = p.slice(-1);
    // 句読点・自然な語尾はそのまま
    if (['。','！','？','…'].includes(last)) return p;
    // 〜い、〜す、〜た、〜だ、〜ん などの文末語尾もそのまま
    if (['い','す','た','だ','ん','る','ね','よ','な'].includes(last)) return p + '。';
    // 〜て、〜で、〜が など途中で切れている感じのものは「…」で和らげる
    if (['て','で','が','し','く','に','を','は'].includes(last)) return p + '…';
    return p + '。';
  }).join('\n');
}

// ─────────────────────────────────────────────────
//  SUMMARY GENERATION
// ─────────────────────────────────────────────────

// 末尾に句読点がなければ補う
function addPunct(text) {
  const last = text.slice(-1);
  return ['。','！','？','…','、'].includes(last) ? text : text + '。';
}

// 末尾が自然な文末（〜て、〜で、〜が）のとき「…」を補う
function softEnd(text) {
  const last = text.slice(-1);
  return ['て','で','が','し','く','に','を','は'].includes(last) ? text + '…' : addPunct(text);
}

// 「〜できた」「〜なった」「楽になった」など前向きな文かを判定
function isPositive(text) {
  return ['楽になった','嬉しかった','楽しかった','助かった','癒された','うまくいった','解決'].some(w => text.includes(w));
}

function generateSummary(grouped) {
  const catOrder = ['trouble', 'work', 'relationship', 'emotion', 'health', 'hobby', 'other'];
  const activeCats = catOrder.filter(id => grouped[id] && grouped[id].length > 0);
  if (activeCats.length === 0) return '整理された内容がありません。';

  // 全アイテムをタイプ付きで収集
  const all = [];
  activeCats.forEach(catId => {
    grouped[catId].forEach(raw => {
      const text = cleanBullet(raw);
      all.push({ text, type: detectType(text), catId });
    });
  });

  // ── 1. 冒頭：一番「話のタネ」になりそうな出来事 ──
  const openerItem =
    all.find(i => i.catId === 'trouble' && ['event','fact'].includes(i.type)) ||
    all.find(i => i.catId === 'work'    && ['event','fact'].includes(i.type)) ||
    all.find(i => ['event','fact'].includes(i.type)) ||
    all[0];

  const openerPrefix = {
    trouble:      'ちょっと困ったことがあって、',
    work:         '仕事（学校）のことなんですが、',
    relationship: '人間関係でちょっとあって、',
    health:       '最近体調がよくなくて、',
    emotion:      '最近なんか、',
  }[openerItem.catId] ?? '実は、';

  const lines = [];
  lines.push(softEnd(openerPrefix + openerItem.text));

  // ── 2. 中間：原因 or 追加の出来事（冒頭と別のもの） ──
  const midItem =
    all.find(i => i !== openerItem && i.type === 'cause') ||
    all.find(i => i !== openerItem && ['event','fact'].includes(i.type) && ['trouble','work'].includes(i.catId));

  if (midItem) {
    const midPrefix = midItem.type === 'cause' ? 'というのも、' : 'さらに、';
    lines.push(softEnd(midPrefix + midItem.text));
  }

  // ── 3. 気持ち ──
  const emotionItem = all.find(i => i.type === 'emotion' && i !== openerItem && i !== midItem);
  if (emotionItem) {
    const emotionPrefix = lines.length > 1 ? 'そのせいか、' : '最近、';
    lines.push(softEnd(emotionPrefix + emotionItem.text));
  }

  // ── 4. 体調（感情と別に存在する場合のみ） ──
  const healthItems = grouped['health'] || [];
  if (healthItems.length > 0 && openerItem.catId !== 'health') {
    const h = cleanBullet(healthItems[0]);
    if (h !== openerItem.text) {
      lines.push(softEnd('体にも影響が出てきていて、' + h));
    }
  }

  // ── 5. ポジティブな出来事（あれば） ──
  const positiveItem = all.find(i =>
    i !== openerItem && i !== midItem && i !== emotionItem && isPositive(i.text)
  );
  if (positiveItem) {
    lines.push(softEnd('ただ、' + positiveItem.text));
  }

  // ── 6. 希望・やりたいこと ──
  const wishItem = all.find(i => i.type === 'wish');
  if (wishItem) {
    lines.push(addPunct('だから、' + wishItem.text));
  }

  // ── クロージング ──
  const closer = wishItem
    ? 'よければ相談に乗ってもらえますか？'
    : '話を聞いてもらえると助かります。';

  // 重複行を除去して結合
  const unique = [...new Set(lines)];
  return unique.join('\n') + '\n\n' + closer;
}

// ─────────────────────────────────────────────────
//  HELPERS
// ─────────────────────────────────────────────────
function cleanBullet(text) {
  return text.replace(/^[\s・\-\*•◦▷▶︎➡️]+/, '')
             .replace(/^[０-９0-9]+[\.。）)．]\s*/, '')
             .trim();
}

function parseLines(raw) {
  return raw.split('\n')
    .map(l => l.trim())
    .filter(l => l.length > 0)
    .map(cleanBullet)
    .filter(l => l.length > 0);
}

// ─────────────────────────────────────────────────
//  MAIN: organize()
// ─────────────────────────────────────────────────
function organize() {
  const raw = document.getElementById('inputArea').value.trim();
  if (!raw) {
    shake(document.getElementById('inputArea'));
    return;
  }

  const lines = parseLines(raw);
  if (lines.length === 0) return;

  // Show loading
  document.getElementById('loading').style.display = 'block';
  document.getElementById('results').style.display = 'none';

  // Slight delay for UX feel
  setTimeout(() => {
    // Classify
    const grouped = {};
    lines.forEach(line => {
      const cat = classifyItem(line);
      if (!grouped[cat]) grouped[cat] = [];
      grouped[cat].push(line);
    });

    // Render
    renderResults(grouped);

    document.getElementById('loading').style.display = 'none';
    document.getElementById('results').style.display = 'block';
    document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 600);
}

function renderResults(grouped) {
  // Summary
  document.getElementById('summaryText').textContent = generateSummary(grouped);

  // Category cards
  const container = document.getElementById('categoryCards');
  container.innerHTML = '';

  const catOrder = ['trouble', 'emotion', 'work', 'relationship', 'health', 'hobby', 'other'];

  catOrder.forEach(catId => {
    const items = grouped[catId];
    if (!items || items.length === 0) return;

    const cat = CATEGORIES.find(c => c.id === catId);
    const name = cat ? cat.name : 'その他';
    const icon = cat ? cat.icon : '📌';
    const colorBg = cat ? cat.colorBg : '#f5f5f5';
    const colorDot = cat ? cat.colorDot : '#888';

    const organized = organizeItems(items);

    const card = document.createElement('div');
    card.className = 'cat-card' + (catId === 'other' ? ' other-card' : '');
    card.innerHTML = `
      <div class="cat-header" style="background:${colorBg}">
        <div class="cat-icon" style="background:${colorDot}22">${icon}</div>
        <span style="color:${colorDot}">${name}</span>
        <span style="color:#aaa;font-weight:400;font-size:13px;margin-left:auto">${items.length}件</span>
      </div>
      <div class="cat-body">
        <div class="raw-items">
          ${items.map(item => `
            <div class="raw-item">
              <div class="raw-dot" style="background:${colorDot}"></div>
              <span>${escHtml(item)}</span>
            </div>`).join('')}
        </div>
        <div class="organized-label">✨ 話の流れに整理</div>
        <div class="organized-text" id="org-${catId}">${escHtml(organized)}</div>
        <button class="copy-btn" onclick="copyText('org-${catId}')">📋 コピー</button>
      </div>
    `;
    container.appendChild(card);
  });
}

// ─────────────────────────────────────────────────
//  UI HELPERS
// ─────────────────────────────────────────────────
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function clearAll() {
  document.getElementById('inputArea').value = '';
  document.getElementById('results').style.display = 'none';
  document.getElementById('loading').style.display = 'none';
  document.getElementById('charCount').textContent = '0';
}

function copyText(id) {
  const text = document.getElementById(id).textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = event.target;
    const orig = btn.textContent;
    btn.textContent = '✅ コピーしました';
    setTimeout(() => { btn.textContent = orig; }, 1800);
  });
}

function shake(el) {
  el.style.animation = 'none';
  el.style.borderColor = '#e74c3c';
  el.offsetHeight;
  setTimeout(() => {
    el.style.borderColor = '';
    el.placeholder = '何か書いてみてください…';
  }, 1000);
}

function insertExample() {
  const example = `・今日の会議でうまく発言できなかった
・上司に「もっとはっきり話して」と言われた
・頑張って準備したのにうまくいかなくて落ち込んでいる
・帰りに友達と少し話したら気持ちが楽になった
・最近ずっと緊張していて疲れてる気がする
・次は少しだけでも自分の意見を言えるようになりたい
・睡眠が浅くてなんか体も重い`;
  document.getElementById('inputArea').value = example;
  document.getElementById('charCount').textContent = example.length;
}

// Char counter
document.getElementById('inputArea').addEventListener('input', function() {
  document.getElementById('charCount').textContent = this.value.length;
});

// Enter key hint on load
window.addEventListener('load', () => {
  document.getElementById('charCount').textContent = '0';
});
</script>
