<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>思考整理ノート</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    /* ─── BASE ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple:  #8b5cf6;
      --pink:    #ec4899;
      --yellow:  #f59e0b;
      --green:   #10b981;
      --blue:    #3b82f6;
      --orange:  #f97316;
      --radius:  20px;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #fdf4ff 0%, #fce7f3 35%, #fef9c3 70%, #ecfdf5 100%);
      padding: 24px 16px 60px;
    }

    /* ─── HEADER ────────────────────────────────────── */
    header {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo {
      font-family: 'Nunito', 'Noto Sans JP', sans-serif;
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 900;
      background: linear-gradient(90deg, #8b5cf6, #ec4899, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #7c6f99;
      font-size: 0.95rem;
      font-weight: 500;
    }

    /* ─── LAYOUT ─────────────────────────────────────── */
    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    .card {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: 0 4px 24px rgba(139,92,246,.1);
      padding: 24px;
      margin-bottom: 20px;
      border: 2px solid transparent;
      transition: border-color .2s;
    }

    .card:focus-within {
      border-color: #e9d5ff;
    }

    .section-label {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ─── INPUT AREA ─────────────────────────────────── */
    .input-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .input-label {
      font-size: 1rem;
      font-weight: 700;
      color: #6d28d9;
    }

    .char-count {
      font-size: 0.8rem;
      color: #a78bfa;
      font-weight: 600;
    }

    #inputArea {
      width: 100%;
      min-height: 160px;
      padding: 14px 16px;
      border: 2px solid #ede9fe;
      border-radius: 14px;
      font-size: 0.95rem;
      font-family: inherit;
      color: #374151;
      resize: vertical;
      line-height: 1.7;
      transition: border-color .2s;
      outline: none;
    }

    #inputArea:focus { border-color: #a78bfa; }
    #inputArea::placeholder { color: #c4b5fd; }

    /* ─── BUTTONS ─────────────────────────────────────── */
    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      font-weight: 700;
      font-family: inherit;
      padding: 10px 18px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      transition: transform .15s, opacity .15s, box-shadow .15s;
    }

    .btn:hover  { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(0,0,0,.12); }
    .btn:active { transform: scale(.96); }
    .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }

    .btn-primary {
      background: linear-gradient(90deg, #8b5cf6, #ec4899);
      color: #fff;
      flex: 1;
      justify-content: center;
      min-width: 120px;
    }

    .btn-mic {
      background: linear-gradient(90deg, #f59e0b, #f97316);
      color: #fff;
      min-width: 52px;
      justify-content: center;
    }

    .btn-mic.listening {
      background: linear-gradient(90deg, #ef4444, #ec4899);
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,.4); }
      50%       { box-shadow: 0 0 0 8px rgba(239,68,68,0); }
    }

    .btn-clear {
      background: #f3f4f6;
      color: #6b7280;
    }

    .btn-history {
      background: #fef3c7;
      color: #92400e;
      position: relative;
    }

    .history-badge {
      position: absolute;
      top: -6px; right: -6px;
      background: #ec4899;
      color: #fff;
      font-size: 0.65rem;
      font-weight: 900;
      border-radius: 50%;
      width: 18px; height: 18px;
      display: flex; align-items: center; justify-content: center;
    }

    .btn-copy {
      background: #fce7f3;
      color: #9d174d;
      flex: 1;
      justify-content: center;
    }

    .btn-download {
      background: #d1fae5;
      color: #065f46;
      flex: 1;
      justify-content: center;
    }

    /* ─── MIC HINT ───────────────────────────────────── */
    .mic-hint {
      font-size: 0.75rem;
      color: #f59e0b;
      margin-top: 8px;
      display: none;
    }

    .mic-hint.visible { display: block; }

    /* ─── LOADING ─────────────────────────────────────── */
    #loadingSection {
      display: none;
      text-align: center;
      padding: 32px;
    }

    .spinner {
      font-size: 2.4rem;
      animation: spin 1.2s linear infinite;
      display: inline-block;
    }

    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .loading-text {
      color: #8b5cf6;
      font-weight: 700;
      margin-top: 10px;
    }

    /* ─── RESULT ─────────────────────────────────────── */
    #resultSection { display: none; }

    .category-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .chip {
      padding: 4px 14px;
      border-radius: 50px;
      font-size: 0.78rem;
      font-weight: 700;
      border: 2px solid;
    }

    .chip-0 { background:#ede9fe; color:#5b21b6; border-color:#c4b5fd; }
    .chip-1 { background:#fce7f3; color:#9d174d; border-color:#f9a8d4; }
    .chip-2 { background:#fef3c7; color:#78350f; border-color:#fcd34d; }
    .chip-3 { background:#d1fae5; color:#065f46; border-color:#6ee7b7; }
    .chip-4 { background:#dbeafe; color:#1e3a8a; border-color:#93c5fd; }
    .chip-5 { background:#ffedd5; color:#7c2d12; border-color:#fdba74; }

    .result-box {
      background: linear-gradient(135deg, #fdf4ff, #fce7f3 60%, #fef9c3);
      border-radius: 14px;
      padding: 18px 20px;
      white-space: pre-wrap;
      line-height: 1.85;
      color: #374151;
      font-size: 0.95rem;
      margin-bottom: 16px;
      border: 1.5px solid #e9d5ff;
    }

    /* ─── HISTORY MODAL ──────────────────────────────── */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.3);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 8px 40px rgba(0,0,0,.18);
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px 16px;
      border-bottom: 1.5px solid #f3f4f6;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: #6d28d9;
    }

    .modal-header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-delete-all {
      font-size: 0.78rem;
      color: #ef4444;
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
    }

    .btn-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #9ca3af;
      line-height: 1;
    }

    .history-list {
      overflow-y: auto;
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .history-item {
      border-radius: 14px;
      padding: 14px 16px;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
    }

    .history-item:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(0,0,0,.08); }

    .history-item-0 { background: #ede9fe; border: 1.5px solid #c4b5fd; }
    .history-item-1 { background: #fce7f3; border: 1.5px solid #f9a8d4; }
    .history-item-2 { background: #fef3c7; border: 1.5px solid #fcd34d; }
    .history-item-3 { background: #d1fae5; border: 1.5px solid #6ee7b7; }
    .history-item-4 { background: #dbeafe; border: 1.5px solid #93c5fd; }
    .history-item-5 { background: #ffedd5; border: 1.5px solid #fdba74; }

    .history-meta {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }

    .history-date {
      font-size: 0.72rem;
      font-weight: 700;
      color: #6b7280;
    }

    .btn-history-del {
      background: none;
      border: none;
      font-size: 0.85rem;
      cursor: pointer;
      color: #9ca3af;
      transition: color .15s;
      padding: 0 2px;
    }

    .btn-history-del:hover { color: #ef4444; }

    .history-preview {
      font-size: 0.85rem;
      color: #374151;
      line-clamp: 2;
      -webkit-line-clamp: 2;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .btn-restore {
      font-size: 0.78rem;
      font-weight: 700;
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      color: #7c3aed;
    }

    .history-empty {
      text-align: center;
      padding: 40px 16px;
      color: #9ca3af;
    }

    /* ─── TOAST ─────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1f2937;
      color: #fff;
      padding: 10px 22px;
      border-radius: 50px;
      font-size: 0.88rem;
      font-weight: 600;
      z-index: 200;
      transition: transform .3s cubic-bezier(.34,1.56,.64,1);
      white-space: nowrap;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }

    /* ─── RESPONSIVE ─────────────────────────────────── */
    @media (max-width: 500px) {
      .btn-row { gap: 8px; }
      .btn { padding: 10px 14px; font-size: 0.85rem; }
    }

    /* ─── MOOD BANNER ────────────────────────────────── */
    .mood-banner {
      border-radius: 14px;
      padding: 14px 18px;
      margin-bottom: 16px;
      font-size: 0.97rem;
      font-weight: 700;
      line-height: 1.6;
      animation: slideIn .45s cubic-bezier(.34,1.56,.64,1);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .mood-positive {
      background: linear-gradient(135deg, #fef9c3, #d1fae5);
      border: 2px solid #6ee7b7;
      color: #065f46;
    }

    .mood-negative {
      background: linear-gradient(135deg, #fce7f3, #ede9fe);
      border: 2px solid #c4b5fd;
      color: #5b21b6;
    }

    /* ─── NO-SPEECH NOTE ─────────────────────────────── */
    .no-speech { display: none; }
  </style>
</head>
<body>

<div class="container">
  <!-- ── HEADER ── -->
  <header>
    <div class="logo">✨ 思考整理ノート</div>
    <div class="subtitle">頭の中をそのまま打ち込むだけで、話せる言葉に整えてくれるよ</div>
  </header>

  <!-- ── INPUT CARD ── -->
  <div class="card">
    <div class="input-header">
      <span class="input-label">✏️ 気持ちや出来事を書いてみよう</span>
      <span class="char-count"><span id="charCount">0</span> 文字</span>
    </div>

    <textarea
      id="inputArea"
      placeholder="例：&#10;・今日の会議でうまく話せなかった&#10;・上司に怒られた気がして怖い&#10;・帰り道、なんか気が重かった&#10;&#10;思ったままでOK！箇条書きでも普通の文でも🙆"
    ></textarea>

    <div id="micHint" class="mic-hint">🎙️ マイクで話してみて — 声が文字になるよ！</div>

    <div class="btn-row">
      <button class="btn btn-primary" id="organizeBtn" onclick="organize()" disabled>✨ 整理する</button>
      <button class="btn btn-mic no-speech" id="micBtn" title="音声入力" onclick="toggleMic()">🎙️</button>
      <button class="btn btn-clear" onclick="clearAll()">🗑 クリア</button>
      <button class="btn btn-history" id="historyBtn" onclick="openHistory()">
        📚 履歴
        <span class="history-badge" id="historyBadge" style="display:none">0</span>
      </button>
    </div>
  </div>

  <!-- ── LOADING ── -->
  <div id="loadingSection">
    <div class="spinner">✨</div>
    <div class="loading-text">ちょっと待ってね、整理中だよ〜！</div>
  </div>

  <!-- ── RESULT CARD ── -->
  <div class="card" id="resultSection">
    <div class="section-label" id="resultLabel" style="color:#db2777">🌸 整理できたよ！</div>
    <div id="moodBanner" style="display:none"></div>
    <div class="category-chips" id="categoryChips"></div>
    <div class="result-box" id="resultBox"></div>
    <div class="btn-row">
      <button class="btn btn-copy" onclick="copyResult()">📋 コピーする</button>
      <button class="btn btn-download" onclick="downloadResult()">💾 テキストで保存</button>
    </div>
  </div>
</div>

<!-- ── HISTORY MODAL ── -->
<div class="modal-overlay" id="historyModal" onclick="closeHistory(event)">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">📚 過去の整理メモ</span>
      <div class="modal-header-actions">
        <button class="btn-delete-all" onclick="clearAllHistory()">全部消す</button>
        <button class="btn-close" onclick="closeHistory()">×</button>
      </div>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<!-- ── TOAST ── -->
<div class="toast" id="toast"></div>

<!-- ═══════════════════════════════════════════════════════
     SCRIPT
     ═══════════════════════════════════════════════════════ -->
<script>

/* ─── CATEGORIES ─────────────────────────────────────── */
const CATEGORIES = [
  { id: 'work',   label: '📚 仕事・学校', keywords: ['仕事','会社','職場','学校','授業','課題','上司','同僚','先生','勉強','バイト','会議','提出','締め切り','テスト','試験','レポート','残業','プレゼン'] },
  { id: 'friend', label: '👥 人間関係',   keywords: ['友達','友人','彼氏','彼女','家族','親','兄','姉','弟','妹','先輩','後輩','関係','喧嘩','仲直り','気まずい','連絡'] },
  { id: 'feel',   label: '💜 気持ち',     keywords: ['嬉しい','悲しい','怖い','不安','寂しい','つらい','しんどい','疲れ','ストレス','モヤモヤ','落ち込','やる気','イライラ','ホッ','安心'] },
  { id: 'body',   label: '🌿 体・健康',   keywords: ['体','疲れ','眠れ','睡眠','食欲','頭痛','病気','病院','体調','運動','ダイエット','太っ'] },
  { id: 'future', label: '🌈 これから',   keywords: ['将来','未来','目標','夢','転職','就活','引越し','計画','やりたい','変えたい','決め'] },
  { id: 'daily',  label: '☀️ 日常',       keywords: ['今日','昨日','朝','夜','ご飯','買い物','天気','散歩','家','部屋','趣味','映画','音楽','読書'] },
];

function detectCategories(text) {
  const found = [];
  for (const cat of CATEGORIES) {
    if (cat.keywords.some(kw => text.includes(kw))) found.push(cat.label);
    if (found.length >= 4) break;
  }
  return found;
}

/* ─── SENTIMENT ──────────────────────────────────────── */
const POSITIVE_WORDS = [
  '嬉しい','楽しい','よかった','うまくいった','成功','褒められ','認められ',
  '感謝','ありがとう','最高','幸せ','ハッピー','ワクワク','できた','達成',
  '好き','大好き','満足','すっきり','ホッ','安心','笑った','楽しかった',
  'テンション上','やる気','前向き','いい感じ','順調','うまくいき','合格',
  '楽しみ','喜び','ポジティブ','サイコー','うれしい','よかっ',
];
const NEGATIVE_WORDS = [
  '悲しい','つらい','しんどい','疲れ','不安','怖い','落ち込','寂しい',
  'ストレス','モヤモヤ','イライラ','辛い','怒り','泣き','泣いた',
  'うまくいかない','怒られ','失敗','後悔','ミス','ダメ','嫌','嫌い',
  'もう無理','限界','やめたい','逃げ','消えたい','しんど','つらかっ',
  '泣いてしまっ','泣きそう','きつい','苦しい','自信','怒られた',
];

const PRAISE_MESSAGES = [
  '🌟 すごいじゃん！その調子でいこう！',
  '✨ いいこと起きたね〜！ちゃんと自分を褒めてあげてね！',
  '🎉 最高！この感じ、大事にしてほしいな！',
  '💪 うまくいってるじゃん！この流れ、乗っていこう！',
  '🌈 素晴らしい！その感覚、ずっと覚えてて！',
  '🎊 やったじゃん！本当によく頑張ったね！',
];

const COMFORT_MESSAGES = [
  '🫂 大変だったね。よくここまで頑張ったよ。',
  '💜 つらい気持ち、ちゃんと受け取ったよ。無理しなくていいからね。',
  '🌷 そう感じるのは全然おかしくないよ。あなたの気持ちは本物だよ。',
  '☁️ 今しんどいね。でも、話してくれてよかった。一人じゃないよ。',
  '🤝 一人で抱えすぎないでね。ここに吐き出して正解だよ。',
  '🌙 今日はもう十分頑張ったよ。ゆっくり休んでね。',
];

function detectSentiment(text) {
  let pos = 0, neg = 0;
  for (const w of POSITIVE_WORDS) if (text.includes(w)) pos++;
  for (const w of NEGATIVE_WORDS) if (text.includes(w)) neg++;
  if (pos === 0 && neg === 0) return 'neutral';
  return pos >= neg ? 'positive' : 'negative';
}

function randomPick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

/* ─── HISTORY ─────────────────────────────────────────── */
const HISTORY_KEY = 'think-history-v2';

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch { return []; }
}

function saveHistory(items) {
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(items)); } catch {}
  updateHistoryBadge(items.length);
}

function addToHistory(input, output) {
  const items = loadHistory();
  items.unshift({ id: Date.now().toString(), input, output, createdAt: new Date().toISOString() });
  saveHistory(items.slice(0, 30));
}

function updateHistoryBadge(count) {
  const badge = document.getElementById('historyBadge');
  badge.textContent = count;
  badge.style.display = count > 0 ? 'flex' : 'none';
}

/* ─── SPEECH RECOGNITION ──────────────────────────────── */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let isListening = false;

if (SR) {
  // Show mic button
  document.querySelectorAll('.no-speech').forEach(el => el.classList.remove('no-speech'));
  document.getElementById('micHint').classList.add('visible');

  recognition = new SR();
  recognition.lang = 'ja-JP';
  recognition.continuous = true;
  recognition.interimResults = true;

  let finalTranscript = '';

  recognition.onresult = (e) => {
    let interim = '';
    finalTranscript = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalTranscript += t;
      else interim += t;
    }
    const area = document.getElementById('inputArea');
    // Append to existing text
    area.value = (area.dataset.base || '') + (finalTranscript || interim);
    if (finalTranscript) area.dataset.base = area.value;
    updateCharCount();
  };

  recognition.onerror = () => stopMic();
  recognition.onend   = () => { if (isListening) recognition.start(); };
}

function toggleMic() {
  if (!recognition) return;
  if (isListening) stopMic(); else startMic();
}

function startMic() {
  isListening = true;
  document.getElementById('inputArea').dataset.base = document.getElementById('inputArea').value;
  document.getElementById('micBtn').classList.add('listening');
  document.getElementById('micBtn').textContent = '⏹️';
  recognition.start();
  showToast('🎙️ 話してみてね！');
}

function stopMic() {
  isListening = false;
  document.getElementById('micBtn').classList.remove('listening');
  document.getElementById('micBtn').textContent = '🎙️';
  try { recognition.stop(); } catch {}
}

/* ─── INPUT HANDLING ─────────────────────────────────── */
document.getElementById('inputArea').addEventListener('input', updateCharCount);

function updateCharCount() {
  const val = document.getElementById('inputArea').value;
  document.getElementById('charCount').textContent = val.length;
  document.getElementById('organizeBtn').disabled = val.trim().length === 0;
}

/* ─── テキスト整理ロジック（ローカル処理） ──────────── */

const CAT_INTROS = {
  work:   ['仕事や学校のこと', '学校・仕事のこと'],
  friend: ['人間関係のこと', '友達や周りのこと'],
  feel:   ['気持ちのこと', '最近の気持ち'],
  body:   ['体のこと', '体調のこと'],
  future: ['これからのこと', '将来のこと'],
  daily:  ['日常のこと', 'ちょっとしたこと'],
};

const OPENERS = [
  (i) => `${i}なんですが、`,
  (i) => `実は${i}があって、`,
  (i) => `${i}で話したいことがあって、`,
];

const CLOSERS_POS = [
  'うまくいってる感じがして、嬉しいんですよね！',
  'なんかいい感じで、気分が上がってます！',
  'ちょっと自信ついてきた気がします！',
];

const CLOSERS_NEG = [
  'ちょっと話を聞いてもらえると助かります。',
  'なんか気になってて、誰かに話したかったんです。',
  'どう思うか聞かせてもらえると嬉しいです。',
  'うまく言えないけど、なんかモヤモヤしてて。',
];

const CLOSERS_NEU = [
  '話を聞いてもらえると助かります。',
  'ちょっと聞いてほしくて。',
  'どう思うか聞かせてもらえる？',
  '誰かに話したかったんですよね。',
];

function parseLines(text) {
  return text.split('\n')
    .map(l => l.replace(/^[・\-\*\s　]+/, '').trim())
    .filter(l => l.length > 0);
}

function classifyLine(text) {
  for (const cat of CATEGORIES) {
    if (cat.keywords.some(kw => text.includes(kw))) return cat;
  }
  return CATEGORIES[5];
}

function buildSummary(lines, mood) {
  const groups = new Map();
  for (const line of lines) {
    const cat = classifyLine(line);
    if (!groups.has(cat.id)) groups.set(cat.id, { cat, items: [] });
    groups.get(cat.id).items.push(line);
  }

  const parts = [];
  for (const { cat, items } of groups.values()) {
    const intros = CAT_INTROS[cat.id] || CAT_INTROS.daily;
    const intro  = intros[Math.floor(Math.random() * intros.length)];
    const opener = OPENERS[Math.floor(Math.random() * OPENERS.length)](intro);
    if (items.length === 1) {
      parts.push(`${opener}${items[0]}。`);
    } else {
      const body = items.slice(0, -1).join('したり、') + 'したり、' + items[items.length - 1];
      parts.push(`${opener}${body}。`);
    }
  }

  const pool   = mood === 'positive' ? CLOSERS_POS : mood === 'negative' ? CLOSERS_NEG : CLOSERS_NEU;
  const closer = pool[Math.floor(Math.random() * pool.length)];
  return parts.join('\n\n') + '\n\n' + closer;
}

/* ─── ORGANIZE ─────────────────────────────────────────── */

async function organize() {
  const input = document.getElementById('inputArea').value.trim();
  if (!input) return;
  if (isListening) stopMic();

  showLoading(true);
  document.getElementById('resultSection').style.display = 'none';

  await new Promise(r => setTimeout(r, 600));

  const lines  = parseLines(input);
  const mood   = detectSentiment(input);
  const result = buildSummary(lines, mood);

  showResult(input, result);
}

/* ─── SHOW RESULT ────────────────────────────────────── */
function showResult(input, result) {
  showLoading(false);

  // ── ムード判定 & バナー表示 ──
  const mood   = detectSentiment(input + ' ' + result);
  const banner = document.getElementById('moodBanner');
  const label  = document.getElementById('resultLabel');

  if (mood === 'positive') {
    banner.className   = 'mood-banner mood-positive';
    banner.textContent = randomPick(PRAISE_MESSAGES);
    banner.style.display = 'block';
    label.textContent  = '🌟 やったじゃん！整理できたよ！';
    label.style.color  = '#065f46';
  } else if (mood === 'negative') {
    banner.className   = 'mood-banner mood-negative';
    banner.textContent = randomPick(COMFORT_MESSAGES);
    banner.style.display = 'block';
    label.textContent  = '💜 ちゃんと受け取ったよ。整理できたよ！';
    label.style.color  = '#7c3aed';
  } else {
    banner.style.display = 'none';
    label.textContent  = '🌸 整理できたよ！';
    label.style.color  = '#db2777';
  }

  // ── カテゴリ ──
  const chips = detectCategories(input + ' ' + result);
  document.getElementById('categoryChips').innerHTML = chips.map((lbl, i) =>
    `<span class="chip chip-${i % 6}">${lbl}</span>`
  ).join('');

  document.getElementById('resultBox').textContent = result;
  document.getElementById('resultSection').style.display = 'block';
  document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth', block: 'start' });

  addToHistory(input, result);
}

/* ─── LOADING ─────────────────────────────────────────── */
function showLoading(show) {
  document.getElementById('loadingSection').style.display = show ? 'block' : 'none';
}

/* ─── COPY / DOWNLOAD ────────────────────────────────── */
function copyResult() {
  const text = document.getElementById('resultBox').textContent;
  navigator.clipboard.writeText(text)
    .then(() => showToast('📋 コピーしたよ！'))
    .catch(() => {
      // fallback
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('📋 コピーしたよ！');
    });
}

function downloadResult() {
  const input  = document.getElementById('inputArea').value;
  const result = document.getElementById('resultBox').textContent;
  const date   = new Date().toLocaleDateString('ja-JP').replace(/\//g, '-');
  const content = `━━━ 思考整理メモ (${date}) ━━━\n\n【入力した内容】\n${input}\n\n【整理した結果】\n${result}\n`;

  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `思考整理メモ_${date}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('💾 ダウンロードしたよ！');
}

/* ─── CLEAR ──────────────────────────────────────────── */
function clearAll() {
  document.getElementById('inputArea').value = '';
  delete document.getElementById('inputArea').dataset.base;
  document.getElementById('charCount').textContent = '0';
  document.getElementById('organizeBtn').disabled = true;
  document.getElementById('resultSection').style.display = 'none';
  if (isListening) stopMic();
}

/* ─── HISTORY MODAL ──────────────────────────────────── */
function openHistory() {
  renderHistoryList();
  document.getElementById('historyModal').classList.add('open');
}

function closeHistory(e) {
  if (!e || e.target === document.getElementById('historyModal')) {
    document.getElementById('historyModal').classList.remove('open');
  }
}

function renderHistoryList() {
  const items = loadHistory();
  const list  = document.getElementById('historyList');

  if (items.length === 0) {
    list.innerHTML = '<div class="history-empty">まだ整理した記録がないよ 📝</div>';
    return;
  }

  list.innerHTML = items.map((item, i) => {
    const cls    = `history-item history-item-${i % 6}`;
    const d      = new Date(item.createdAt);
    const dateStr = d.toLocaleDateString('ja-JP') + ' ' + d.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
    const preview = item.input.replace(/\n/g, '　').substring(0, 80);
    return `
      <div class="${cls}">
        <div class="history-meta">
          <span class="history-date">🕐 ${dateStr}</span>
          <button class="btn-history-del" onclick="deleteHistory('${item.id}')">✕</button>
        </div>
        <div class="history-preview">${escapeHtml(preview)}</div>
        <button class="btn-restore" onclick="restoreHistory('${item.id}')">→ これを読み込む</button>
      </div>
    `;
  }).join('');
}

function restoreHistory(id) {
  const item = loadHistory().find(h => h.id === id);
  if (!item) return;
  document.getElementById('inputArea').value = item.input;
  updateCharCount();
  showResult(item.input, item.output);
  closeHistory();
}

function deleteHistory(id) {
  saveHistory(loadHistory().filter(h => h.id !== id));
  renderHistoryList();
}

function clearAllHistory() {
  if (!confirm('履歴を全部消す？')) return;
  saveHistory([]);
  renderHistoryList();
}

/* ─── TOAST ──────────────────────────────────────────── */
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ─── UTILS ──────────────────────────────────────────── */
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ─── INIT ───────────────────────────────────────────── */
(function init() {
  updateHistoryBadge(loadHistory().length);
})();

</script>
